name: Release (IPA für SideStore)

# Baut eine unsignierte IPA und versieht sie mit einer Ad-hoc-Signatur samt
# Berechtigungen (HealthKit, App Group). SideStore liest diese Berechtigungen
# und signiert die App mit deiner Apple-ID neu.
#
# Auslösen (empfohlen): GitHub → Actions → „Release (IPA für SideStore)“ →
# „Run workflow“ → Version eingeben (z. B. 0.1.0). Der Workflow legt danach
# selbst den Tag `v0.1.0` und das GitHub-Release mit `Orbit.ipa` an.
# Alternativ: einen Tag `v…` pushen.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne „v“, z. B. 0.1.0"
        required: true
        default: "0.1.0"
      prerelease:
        description: "Als Vorabversion markieren (zählt nicht als neueste Version)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Ungültige Version „$version“. Erwartet z. B. 0.1.0 oder 0.2.0-rc.1"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* || "$INPUT_PRERELEASE" == "true" ]]; then
            prerelease=true
          fi
          # Ohne Bindestrich-Teil für CFBundleShortVersionString (nur Zahlen erlaubt).
          echo "marketing=${version%%-*}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Version ${version} (Tag v${version}, Build ${GITHUB_RUN_NUMBER}, Vorabversion: ${prerelease})"

      - name: Xcode wählen
        run: Scripts/ci/select_xcode.sh

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Archiv bauen (ohne Signatur)
        run: |
          mkdir -p build
          set +e
          xcodebuild archive \
            -project Tagwerk.xcodeproj \
            -scheme Tagwerk \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Tagwerk.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build/archive.log 2>&1
          status=$?
          set -e
          grep -E "error:|\*\* ARCHIVE (SUCCEEDED|FAILED) \*\*" build/archive.log | head -200 || true
          exit $status

      - name: Ad-hoc-Signatur mit Berechtigungen
        run: |
          set -o pipefail
          Scripts/ci/adhoc_sign.sh build/Tagwerk.xcarchive/Products/Applications/Tagwerk.app | tee build/entitlements.txt

      - name: IPA packen
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/Tagwerk.xcarchive/Products/Applications/Tagwerk.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Orbit.ipa Payload)
          ls -la build/Orbit.ipa

      - name: IPA als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-ipa
          path: build/Orbit.ipa

      - name: Ergebnisse auf Branch ci-release ablegen
        if: always()
        # Ein Fehler hier darf das Release nicht verhindern.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: Scripts/ci/publish_results.sh release "${{ job.status }}"

      - name: GitHub-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Orbit ${{ steps.version.outputs.tag }}
          files: build/Orbit.ipa
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: |
            Orbit ${{ steps.version.outputs.tag }} (Build ${{ steps.version.outputs.build }})

            Installation: `Orbit.ipa` mit iloader oder SideStore installieren.
            Anleitung: [docs/SIDELOAD.md](https://github.com/${{ github.repository }}/blob/main/docs/SIDELOAD.md)
